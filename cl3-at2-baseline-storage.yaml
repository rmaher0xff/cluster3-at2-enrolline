# Document Bucket #
DocumentBucket:
  Type: AWS::S3::Bucket
  DependsOn: LogsBucketPolicy
  Properties:
    BucketName: !Ref DocumentBucketName

    VersioningConfiguration:
      Status: Enabled

    PublicAccessBlockConfiguration:
      BlockPublicAcls: true
      BlockPublicPolicy: true
      IgnorePublicAcls: true
      RestrictPublicBuckets: true

    BucketEncryption:
      ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

    LifecycleConfiguration:
      Rules:
        - Id: DocumentLifecycle
          Status: Enabled
          Transitions:
            - StorageClass: STANDARD_IA
              TransitionInDays: 90
            - StorageClass: GLACIER_IR
              TransitionInDays: 730

    # Send S3 server access logs here #
    LoggingConfiguration:
      DestinationBucketName: !Ref LogsBucket
      LogFilePrefix: yat-enrolline-logs/

    Tags:
      - Key: Name
        Value: yat-enrolline-documents


# S3 Access Logs Bucket #
LogsBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: !Ref LogsBucketName

    VersioningConfiguration:
      Status: Enabled

    PublicAccessBlockConfiguration:
      BlockPublicAcls: true
      BlockPublicPolicy: true
      IgnorePublicAcls: true
      RestrictPublicBuckets: true

    BucketEncryption:
      ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

    Tags:
      - Key: Name
        Value: yat-enrolline-logs


# Bucket Policy for S3 and ALB Access Logs #
LogsBucketPolicy:
  Type: AWS::S3::BucketPolicy
  Properties:
    Bucket: !Ref LogsBucket
    PolicyDocument:
      Version: "2012-10-17"
      Statement:

        # Allow S3 server access logs #
        - Sid: AllowS3ServerAccessLogs
          Effect: Allow
          Principal:
            Service: logging.s3.amazonaws.com
          Action:
            - s3:PutObject
          Resource: !Sub "arn:aws:s3:::${LogsBucket}/yat-enrolline-logs/*"
          Condition:
            ArnLike:
              aws:SourceArn: !Sub "arn:aws:s3:::${DocumentBucketName}"
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId

        # Allow ALB access logs #
        - Sid: AllowALBAccessLogs
          Effect: Allow
          Principal:
            Service: logdelivery.elasticloadbalancing.amazonaws.com
          Action:
            - s3:PutObject
          Resource: !Sub "arn:aws:s3:::${LogsBucket}/alb-access-logs/AWSLogs/${AWS::AccountId}/*"
          Condition:
            ArnLike:
              aws:SourceArn: !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*"
