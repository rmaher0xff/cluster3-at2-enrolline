# Document Bucket #
DocumentBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: !Ref DocumentBucketName
      
    VersioningConfiguration:
      Status: Enabled
              
  PublicAccessBlockConfiguration:
    BlockPublicAcls: true
    BlockPublicPolicy: true
    IgnorePublicAcls: true
    RestrictPublicBuckets: true

  BucketEncryption:
    ServerSideEncryptionConfiguration:
      - ServerSideEncryptionByDefault:
          SSEAlgorithm: AES256              

  LifecycleConfiguration:
    Rules: 
      - Id: TransitionToStandardIA
        Status: Enabled
        Transitions:
          - StorageClass: STANDARD_IA
            TransitionInDays: 90
# Objects are moved to glacier 730 days after CREATION - not 730 days after the transition to Standard-IA #
      - Id: TransitionToGlacierInstantRetrieval
        Status: Enabled
        Transitions:
          - StorageClass: GLACIER_IR
            TransitionInDays: 730
# Send S3 access logs here #
  LoggingConfiguration:
    DestinationBucketName: !Ref LogsBucket
    LogFilePrefix: yat-enrolline-logs/
    
  Tags:
    - Key: Name
      Value: yat-enrolline-documents
          
# S3 Access Logs Bucket #
LogsBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: !Ref LogsBucketName
    VersioningConfiguration:
      Status: Enabled
              
    PublicAccessBlockConfiguration:
      BlockPublicAcls: true
      BlockPublicPolicy: true
      IgnorePublicAcls: true
      RestrictPublicBuckets: true

    BucketEncryption:
      ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

    Tags:
      - Key: Name
        Value: yat-enrolline-logs

          
# Bucket Policy that grants the ALB permission to write access logs #
LogsBucketPolicy:
  Type: AWS::S3::BucketPolicy
  Properties:
    Bucket: !Ref LogsBucket
    PolicyDocument:
      Version: "2012-10-17"
      Statement:
        - Sid: AllowALBAccessLogs
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AlbAccountId}:root"
        Action: "s3:PutObject"
        Resource: !Sub "arn:aws:s3:::${LogsBucket}/yat-enrolline-logs/AWSLogs/${AWS::AccountId}/*"


